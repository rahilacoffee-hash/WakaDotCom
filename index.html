<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wakadotcom</title>

    <!-- ===================================================================
         WAKA LOADER STYLES
         Fully transparent background — overlays the page instead of
         dimming it. Sits at the very top of <head> so there's zero
         chance of a flash-of-unstyled-loader before it paints.
    =================================================================== -->
    <style>
      #waka-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: rgba(255, 255, 255, 0);
        transition: opacity 0.5s ease;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      }

      .waka-loader__badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 999px;
        border: 1px solid rgba(249, 115, 22, 0.25);
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(6px);
        color: #c2410c;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .waka-loader__dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #f97316;
        animation: waka-pulse 1.1s ease-in-out infinite;
      }
      @keyframes waka-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.6); opacity: 0.4; }
      }

      .waka-loader__mark {
        font-size: 44px;
        font-weight: 900;
        letter-spacing: -0.03em;
        color: #1b1b1b;
        line-height: 1;
      }
      .waka-loader__mark span { color: #f97316; }

      .waka-loader__bar {
        width: 220px;
        height: 6px;
        border-radius: 999px;
        background: rgba(27, 27, 27, 0.08);
        overflow: hidden;
      }
      .waka-loader__bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #fb923c, #f97316);
        transition: width 0.25s ease-out;
      }

      .waka-loader__percent {
        font-size: 12px;
        font-weight: 700;
        color: #a16207;
        font-variant-numeric: tabular-nums;
      }

      .waka-loader__spark {
        position: absolute;
        color: #1b1b1b;
        opacity: 0.6;
        animation: waka-spark-float 2.4s ease-in-out infinite;
      }
      .waka-loader__spark--1 { top: 32%; left: 32%; animation-delay: 0s; }
      .waka-loader__spark--2 { top: 62%; right: 30%; animation-delay: 0.6s; }
      @keyframes waka-spark-float {
        0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
        50% { transform: translateY(-6px) scale(1.15); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <!-- ===================================================================
         WAKA LOADER MARKUP
         First thing in <body>, above #root, so it paints before React
         has even downloaded — let alone mounted.
    =================================================================== -->
    <div id="waka-loader" aria-hidden="true">
      <div class="waka-loader__badge">
        <span class="waka-loader__dot"></span>
        Loading your ecosystem
      </div>
      <div class="waka-loader__mark">Waka<span>.</span></div>
      <div class="waka-loader__bar">
        <div class="waka-loader__bar-fill" id="waka-loader-fill"></div>
      </div>
      <div class="waka-loader__percent" id="waka-loader-percent">0%</div>

      <svg class="waka-loader__spark waka-loader__spark--1" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="currentColor"/>
      </svg>
      <svg class="waka-loader__spark waka-loader__spark--2" width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="currentColor"/>
      </svg>
    </div>

    <!-- ===================================================================
         WAKA LOADER SCRIPT
         Real-time progress via the browser's own Resource Timing API —
         not a fake timer. Finishes when App.jsx dispatches
         'waka:app-ready' (see the useEffect snippet you were given),
         with window.load as a safety fallback so it can never hang.
    =================================================================== -->
    <script>
      (function () {
        function initWakaLoader() {
          var loader = document.getElementById('waka-loader');
          var fill = document.getElementById('waka-loader-fill');
          var percentEl = document.getElementById('waka-loader-percent');
          if (!loader || !fill || !percentEl) return;

          var loadedCount = 0;
          var estimatedTotal = Math.max(
            document.images.length +
            document.scripts.length +
            document.querySelectorAll('link[rel="stylesheet"]').length,
            6
          );

          function setProgress(p) {
            var clamped = Math.max(0, Math.min(100, p));
            fill.style.width = clamped + '%';
            percentEl.textContent = Math.round(clamped) + '%';
          }

          var observer;
          if (window.PerformanceObserver) {
            try {
              observer = new PerformanceObserver(function (list) {
                loadedCount += list.getEntries().length;
                setProgress((loadedCount / estimatedTotal) * 95);
              });
              observer.observe({ type: 'resource', buffered: true });
            } catch (e) { /* older browser: falls back to load-event finish below */ }
          }

          var finished = false;
          function finish() {
            if (finished) return;
            finished = true;
            setProgress(100);
            setTimeout(function () {
              loader.style.opacity = '0';
              setTimeout(function () {
                loader.style.display = 'none';
                loader.style.pointerEvents = 'none';
                if (observer) observer.disconnect();
              }, 500);
            }, 200);
          }

          // Primary trigger: React tells us it's mounted and painted.
          document.addEventListener('waka:app-ready', finish, { once: true });

          // Safety fallback: never hang, even if that event is missing.
          if (document.readyState === 'complete') {
            finish();
          } else {
            window.addEventListener('load', finish, { once: true });
          }
        }

        initWakaLoader();
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
